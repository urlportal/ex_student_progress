services:
  app:
    build:
      context: .
      dockerfile: deploy/dev/docker/Dockerfile
      args:
        CONTAINER_EXEC_USER_ID: "${CONTAINER_EXEC_USER_ID:-1000}"
        CONTAINER_EXEC_GROUP_ID: "${CONTAINER_EXEC_GROUP_ID:-1000}"
    environment:
      APP_ENV: dev
      XDEBUG_TRIGGER: 1
      XDEBUG_MODE: 'develop,debug'
      PHP_IDE_CONFIG: 'serverName=0.0.0.0'
    volumes: !override
      - ./:/app:delegated
      - composer_cache:/var/cache/composer
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  nginx:
    ports:
      - '7777:80'
    networks: !override
      - internal

  postgres:
    ports:
      - '15433:5432'

  rabbitmq:
    ports:
      - '5672:5672'
      - '15672:15672'
    networks: !override
      - internal

#  elasticsearch:
#    ports:
#      - '9200:9200'
#
#  kibana:
#    ports:
#      - '5601:5601'

  redis_commander:
    image: 'ghcr.io/joeferner/redis-commander:0.8.0'
    container_name: "${APP_NAME}-redis-commander"
    profiles: [app]
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: 'local:redis:6379'
    depends_on:
      redis:
        condition: 'service_healthy'
    networks:
      - internal

