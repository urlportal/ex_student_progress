networks:
  internal:
    name: "${APP_NAME}-internal"
    driver: bridge
    external: false
  traefik:
    name: "${APP_NAME}-traefik-local"
    driver: bridge
    external: false

volumes:
  postgres_data: !override
    external: false
  composer_cache: !override
    external: false
