networks:
  # Сеть для приложения и инфраструктуры
  internal:
    name: "${APP_NAME}-internal"
    external: true
    driver: bridge

  # Сеть Traefik
  traefik:
    name: "${TRAEFIK_NETWORK}"
    external: true

  # Сеть для тестов
  test_internal:
    name: "${APP_NAME}-test-internal"
    driver: bridge

volumes:
  postgres_data:
    name: "${VOLUME_NAME_POSTGRES_DATA}"
    external: true
  composer_cache:
    name: "${VOLUME_NAME_COMPOSER_CACHE}"
    external: true
