framework:
    messenger:
        failure_transport: failed

        transports:
            async_score_aggregation:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
                options:
                    auto_setup: false
                    exchange:
                        name: scoring_direct
                        type: direct
                        default_publish_routing_key: score_aggregation
                    queues:
                        score_aggregation:
                            binding_keys: [score_aggregation]

            async_cache:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
                options:
                    auto_setup: false
                    exchange:
                        name: cache_invalidation_fanout
                        type: fanout
                    queues:
                        cache_invalidation: ~

            async_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
                options:
                    auto_setup: false
                    exchange:
                        name: events_topic
                        type: topic
                    queues:
                        event_processing:
                            binding_keys: ['#']

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            App\Application\Message\RecalculateStudentLessonSkillScores: async_score_aggregation
            App\Application\Message\ScoreTask: async_score_aggregation
            App\Application\Message\InvalidateCache: async_cache
            App\Application\Message\CacheInvalidated: async_events
